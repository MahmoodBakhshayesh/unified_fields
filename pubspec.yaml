name: unified_fields
description: Standalone unified form fields, pickers, and date/time UI for Flutter apps.
version: 0.1.5
homepage: https://github.com/MahmoodBakhshayesh/unified_fields
repository: https://github.com/MahmoodBakhshayesh/unified_fields
issue_tracker: https://github.com/MahmoodBakhshayesh/unified_fields/issues

environment:
  sdk: ^3.10.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  shamsi_date: ^1.1.1
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: KookFaNum
      fonts:
        - asset: assets/fonts/KookFaNum-Regular.ttf
