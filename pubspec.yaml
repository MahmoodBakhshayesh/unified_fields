name: unified_fields

description: >-
  Unified Flutter form fields, phone input with country flags, pickers,
  Jalali/Gregorian date and time, Persian digits, and Form validate/save/reset.
version: 1.0.1+2
homepage: https://github.com/MahmoodBakhshayesh/unified_fields
repository: https://github.com/MahmoodBakhshayesh/unified_fields
issue_tracker: https://github.com/MahmoodBakhshayesh/unified_fields/issues

topics:
  - flutter
  - forms
  - input
  - phone-number
  - date-picker

environment:
  sdk: ^3.10.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.17
  intl: ^0.20.2
  shamsi_date: ^1.1.1
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/flags/countries/
  fonts:
    - family: KookFaNum
      fonts:
        - asset: assets/fonts/KookFaNum-Regular.ttf
